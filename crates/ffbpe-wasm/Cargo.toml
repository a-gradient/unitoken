[package]
name = "ffbpe-wasm"
version = "0.1.10"
edition = "2024"
description = "WebAssembly bindings for FFBPE"
repository = "https://github.com/tokn-ai/ffbpe"
license = "MIT"
publish = false

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt cannot execute in some sandboxed builders.
# Consumers can optimize the generated module as a post-build step.
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
ffbpe = { path = "../..", default-features = false }
js-sys = "0.3.103"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.126"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
