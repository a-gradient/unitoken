[project]
name = "ffbpe"
version = "0.1.9"
description = "Unicode-aware, streaming BPE training and tiktoken-compatible encoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://tokn-ai.dev/ffbpe/"
Documentation = "https://tokn-ai.dev/ffbpe/docs/"
Repository = "https://github.com/tokn-ai/ffbpe"
Issues = "https://github.com/tokn-ai/ffbpe/issues"

[dependency-groups]
dev = [
  "pyarrow>=21.0.0",
  "pytest>=9.0.3",
  "requests>=2.32.5",
  "tiktoken>=0.12.0",
  "tokenizers>=0.22.1",
]
docs = [
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.29,<1",
]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "src/**/*.rs"}]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "ffbpe._lib"
bindings = "pyo3"
features = ["py"]
