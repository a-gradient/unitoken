[project]
name = "uni-tokenizer"
version = "0.1.7"
description = "Deprecated: use ffbpe for Unicode-aware, streaming BPE training and encoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]
classifiers = [
  "Development Status :: 7 - Inactive",
]

[project.urls]
FFBPE = "https://github.com/tokn-ai/ffbpe"
Repository = "https://github.com/tokn-ai/ffbpe"
Issues = "https://github.com/tokn-ai/ffbpe/issues"

[dependency-groups]
dev = [
  "pyarrow>=21.0.0",
  "pytest>=9.0.3",
  "requests>=2.32.5",
  "tiktoken>=0.12.0",
  "tokenizers>=0.22.1",
]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "src/**/*.rs"}]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "uni_tokenizer._lib"
bindings = "pyo3"
features = ["py"]
